[project]
name = "pip-host"
version = "1.0.0"
description = "PIP focus companion host service (FastAPI + SQLite + planner + device link)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pyserial>=3.5",
    "pillow>=10.3",
    "numpy>=1.26",
    "keyring>=25",
    "tzdata>=2024.1",
    "cryptography>=42",
    "faster-whisper>=1.0",
    "onnx-asr==0.12.0",
    "truststore>=0.10",
    "piper-tts>=1.2",
    "pystray>=0.19",
    "pywebview>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "playwright>=1.45", "pyinstaller>=6.10"]

[tool.ruff]
line-length = 135
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "UP042", "UP031"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["service.protocol.*", "service.planner.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
asyncio_mode = "auto"
